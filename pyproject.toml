[project]
name = "ldaca-wordflow-binder"
version = "0.1.0"
description = "Binder wrapper for LDaCA Wordflow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["ldaca-wordflow[deploy]==0.7.7", "torch"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
