name: ldaca-binder
channels:
  - conda-forge
dependencies:
  # 3.14.5+ required: earlier 3.14.x cannot evaluate `X | Y | "Fwd"` string
  # unions, so pydantic fails to import ldaca_wordflow's provenance models.
  # Keep the exact `python=X.Y.Z` form — repo2docker's version detection
  # does not understand range specs and silently falls back to its default.
  - python=3.14.5
  - pip
  - pip:
      - uv
      # TEST BUILD for Monika: Wordflow v0.7 at 2389be0a (unreleased changes
      # since 0.7.11, #354 to #364, with polars-text 0.6.7), installed from the
      # master repo's pre-release asset.
      - ldaca-wordflow[deploy] @ https://github.com/Australian-Text-Analytics-Platform/LDaCa_Text_Analytics_Tools/releases/download/test-wordflow-2389be0a/ldaca_wordflow-0.7.11-py3-none-any.whl
      - pydantic>=2.13.4
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
